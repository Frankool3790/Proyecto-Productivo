# Navegador
webdriver.driver=chrome
webdriver.chrome.driver=src/test/resources/driver/chromedriver.exe
webdriver.base.url=http://127.0.0.1:5173

# Proyecto
serenity.project.name=FoodTrans NQR

# Browser
serenity.use.unique.browser=false
serenity.browser.width=1600
serenity.browser.height=800

# Esperas
webdriver.wait.for.timeout=20000

# Evidencias
serenity.take.screenshots=AFTER_EACH_STEP
serenity.verbose.steps=false

# Encoding
serenity.report.encoding=UTF8
feature.file.encoding=UTF8

# Root package
serenity.test.root=co.com.foodtrans.automation.runners

# Capabilities
serenity.driver.capabilities=name:proyecto;unhandledPromptBehavior:ignore;handlesAlerts:true

# Chrome
chrome.switches=--disable-infobars,--disable-notifications,--remote-allow-origins=*
